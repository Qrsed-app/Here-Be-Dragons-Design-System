name: Deploy docs to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ds.qrsed.com
    env:
      # The registry build bakes it into every dependency URL (so `npx shadcn add`
      # resolves @hbd dependencies without config); the docs build into each page's
      # install snippet.
      NEXT_PUBLIC_SITE_URL: https://ds.qrsed.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the registry JSON, copy it (+ fonts) into the docs app, then export.
      - run: pnpm --filter @hbd/registry registry:build
      - run: pnpm --filter @hbd/docs registry:build
      - name: Build docs (static export)
        run: pnpm --filter @hbd/docs build

      # Run from the app directory so wrangler picks up apps/docs/wrangler.jsonc.
      # Pinned through dlx rather than a devDependency, so the deploy does not
      # depend on wrangler being in the lockfile.
      - name: Deploy to Cloudflare
        working-directory: apps/docs
        run: pnpm dlx wrangler@4.131.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
