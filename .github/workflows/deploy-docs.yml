name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before the build: its base_url is baked into the docs' install snippets.
      - uses: actions/configure-pages@v5
        id: pages

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the registry JSON, copy it (+ fonts) into the docs app, then export.
      - run: pnpm --filter @hbd/registry registry:build
      - run: pnpm --filter @hbd/docs registry:build
      - name: Build docs (static export)
        env:
          # Repo-name base path so assets/links resolve under /<repo>/.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Published origin + path, so `npx shadcn add <url>` on every component
          # page points at this deployment instead of localhost.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm --filter @hbd/docs build

      # GitHub Pages (Jekyll) ignores folders starting with "_" (e.g. _next)
      # unless this file is present.
      - name: Disable Jekyll
        run: touch apps/docs/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
